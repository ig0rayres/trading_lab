openapi: 3.0.3
info:
  title: Trading Lab HTTP boundary
  version: 0.3.0
  description: >
    Gerado pelo analista-sistema na Fase 5. Revisado em 2026-11-18 (Sinais ISS-024).
    Criar ordem nao e um endpoint. paper_orders nasce dentro do paper-gateway
    depois dos dois gates.
    Escrita de gatilho: control_flags, market_controls, strategy_states.
    Painel Sinais: leitura de bundle, reload em disco (N53), job de candidatos (N54 contrato),
    pre-aprovacao de provedores — nenhum envia ordem.
    Nomes de campo iguais aos do DBML onde houver tabela.
servers:
  - url: http://127.0.0.1
    description: Processo local. Sem porta publica neste corte.
tags:
  - name: signal-gate-a
    description: Autenticidade do sinal. Nao envia ordem.
  - name: observability
    description: Leitura do ciclo e escrita de gatilho. Nao envia ordem.
  - name: panel-sinais
    description: >
      Rota /sinais — candidatos, pre-aprovacao, inventario. Refresh nao aprova nem envia ordem.
      Chave Collective2 somente no servidor (job N54). LIVE false.
paths:
  /webhooks/tradingview:
    post:
      tags: [signal-gate-a]
      summary: Receber sinal do TradingView
      description: >
        Autenticacao preferida via header X-Webhook-Token (docs/api-spec.yaml).
        Compatibilidade EasyPanel: POST /webhook/{TV_WEBHOOK_TOKEN} sem header (404 se invalido).
      operationId: receiveTradingViewSignal
      security:
        - webhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalEventInput'
      responses:
        '200':
          description: Evento autentico gravado. status no corpo diz se foi accepted ou rejected. Nao e ordem na corretora.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /dashboard/snapshot:
    get:
      tags: [observability]
      summary: Ler o ultimo ciclo, rejeicoes e ledger visivel
      operationId: getDashboardSnapshot
      security:
        - dashboardAuth: []
      responses:
        '200':
          description: Fotografia somente leitura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/signals:
    get:
      tags: [panel-sinais]
      summary: Ler bundle Sinais (auditoria + copy)
      description: >
        Sessao obrigatoria. Monta build_panel_bundle: signals[] (Feature 9 ingresso)
        e copy (pre-aprovacao, operacao, inventario, criterios, collective2, pool Prodigy).
        Nao envia ordem. Aprovar provedor e POST /api/signals/providers.
      operationId: getPanelSignals
      security:
        - operatorSession: []
      responses:
        '200':
          description: Bundle somente leitura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelSignalsPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Bundle indisponivel (PANEL_OPS_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/signals/reload:
    get:
      tags: [panel-sinais]
      summary: Reler bundle de sinais do disco (refresh honesto N53)
      description: >
        mode=disk_reread. Chama build_panel_bundle de novo. Nao chama prodigy_rank.calculate,
        nao consulta Collective2, nao aprova provedor, nao envia ordem.
        Para critérios ao vivo use POST /api/signals/candidates/refresh (N54).
      operationId: reloadPanelSignals
      security:
        - operatorSession: []
      responses:
        '200':
          description: Bundle relido a partir de disco/ledger existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelSignalsReloadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Falha ao reler bundle; fila anterior na UI deve permanecer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelSignalsReloadError'
  /api/signals/candidates/refresh:
    post:
      tags: [panel-sinais]
      summary: Job critérios ao vivo — atualizar candidatos (N54 / ISS-024)
      description: >
        mode=live_criteria. Sessao obrigatoria. Dispara job server-side allowlisted:
        reaplica critérios Feature 4 e janela Prodigy 15d (prodigy_rank.calculate reutilizado),
        consulta Collective2 apenas no processo (C2_API4_KEY no ambiente — nunca no browser),
        TradingView = origens ja ingeridas (sem API de busca inventada).
        Regrava JSON de pesquisa em REPORTS_DIR e re-monta bundle.
        Nao altera signal_provider_approvals. Nao aprova nem rejeita. Nao envia ordem.
        LIVE_TRADING_ENABLED permanece false.
        Implementacao prevista sprint N54; contrato fixado nesta revisao.
      operationId: refreshSignalCandidatesLive
      security:
        - operatorSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidatesRefreshRequest'
      responses:
        '200':
          description: Job concluido; bundle atualizado com fontes consultadas no servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelSignalsLiveRefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Cooldown R4 — aguardar antes de novo job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesRefreshCooldown'
        '502':
          description: Falha upstream (ex. Collective2 ou rank) sem apagar bundle anterior.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesRefreshUpstreamError'
        '503':
          description: Ledger ou volume indisponivel; job nao executado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/signals/providers:
    post:
      tags: [panel-sinais]
      summary: Pre-aprovar ou rejeitar provedor candidato
      description: >
        Grava em signal_provider_approvals (migration 003). action approve|reject.
        Aprovar libera roteamento paper na lista C2 nomeada — nao e fill e nao envia ordem.
        Rejeicao no painel vence semente JSON/env para o mesmo provider_id.
        Requer LEDGER_DATABASE_URL e tabela aplicada.
      operationId: postSignalProviderDecision
      security:
        - operatorSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalProviderDecisionRequest'
      responses:
        '200':
          description: Decisao gravada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalProviderDecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: platform, provider_id ou action invalidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Ledger indisponivel ou tabela 003 ausente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/triggers:
    get:
      tags: [observability]
      summary: Ler gatilhos vigentes
      operationId: getTriggers
      security:
        - operatorSession: []
      responses:
        '200':
          description: control_flags e market_controls. Sem segredo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [observability]
      summary: Alterar parada, operacao demo ou ancora
      operationId: patchTriggers
      security:
        - operatorSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerPatch'
      responses:
        '200':
          description: Valor gravado. A linha anterior fica em trigger_changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlFlags'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/markets/{market}:
    patch:
      tags: [observability]
      summary: Ligar ou desligar a operacao demo de um mercado
      operationId: patchMarketControl
      security:
        - operatorSession: []
      parameters:
        - name: market
          in: path
          required: true
          schema:
            type: string
            enum: [B3_EQUITY, CRYPTO, FOREX]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketControlPatch'
      responses:
        '200':
          description: market_controls atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/strategies/{strategy_key}:
    patch:
      tags: [observability]
      summary: Mudar a fase de uma estrategia que ja existe
      operationId: patchStrategyPhase
      security:
        - operatorSession: []
      parameters:
        - name: strategy_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyPhasePatch'
      responses:
        '200':
          description: strategy_states atualizado. Nao cria estrategia nova.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Token
      description: Segredo no ambiente. Tamanho minimo 32. O valor nao entra nesta spec.
    dashboardAuth:
      type: http
      scheme: bearer
      description: Leitura publicada. O valor nao entra nesta spec.
    operatorSession:
      type: apiKey
      in: cookie
      name: trading_lab_session
      description: >
        Escrita de gatilho. Bearer sozinho nao autoriza PATCH.
        O valor do cookie nao entra nesta spec.
  responses:
    Unauthorized:
      description: Nao autenticado
    Forbidden:
      description: Autenticado sem permissao, ou live ligado
    NotFound:
      description: Recurso ausente
    Unprocessable:
      description: Validacao falhou
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ServerError:
      description: Falha interna sem vazar segredo
  schemas:
    ErrorBody:
      type: object
      required: [reject_code]
      properties:
        reject_code:
          type: string
        status:
          type: string
    SignalEventInput:
      type: object
      required: [idempotency_key, source, symbol, side]
      properties:
        idempotency_key:
          type: string
          maxLength: 128
        source:
          type: string
          maxLength: 64
        symbol:
          type: string
          maxLength: 32
        side:
          type: string
          enum: [long, short]
        strategy_key:
          type: string
          maxLength: 64
    SignalEvent:
      type: object
      description: Mesmos nomes de signal_events no DBML.
      required: [id, idempotency_key, source, symbol, side, status, received_at]
      properties:
        id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        source:
          type: string
        symbol:
          type: string
        market:
          type: string
          nullable: true
          enum: [B3_EQUITY, CRYPTO, FOREX]
        side:
          type: string
          enum: [long, short]
        status:
          type: string
          enum: [received, rejected, accepted]
        reject_code:
          type: string
          nullable: true
        received_at:
          type: string
          format: date-time
    RiskDecision:
      type: object
      required: [id, signal_event_id, strategy_key, decision]
      properties:
        id:
          type: string
          format: uuid
        signal_event_id:
          type: string
          format: uuid
        strategy_key:
          type: string
        decision:
          type: string
          enum: [rejected, paper_allowed]
        reject_code:
          type: string
          nullable: true
        risk_amount_cents:
          type: integer
          format: int64
    PaperOrder:
      type: object
      required: [id, risk_decision_id, client_order_id, symbol, side, status]
      properties:
        id:
          type: string
          format: uuid
        risk_decision_id:
          type: string
          format: uuid
        client_order_id:
          type: string
        broker_order_id:
          type: string
          nullable: true
        symbol:
          type: string
        market:
          type: string
          nullable: true
          enum: [B3_EQUITY, CRYPTO, FOREX]
        side:
          type: string
          enum: [long, short]
        status:
          type: string
        qty:
          type: string
          description: Decimal como texto para nao perder precisao.
    PlatformHealth:
      type: object
      required: [schema_version, generated_at, overall, components]
      properties:
        schema_version:
          type: string
          enum: [platform-health-1]
        generated_at:
          type: string
          format: date-time
        overall:
          type: string
          enum: [ok, degraded, down]
        components:
          type: array
          items:
            type: object
            required: [id, status, detail]
            properties:
              id:
                type: string
                enum: [ledger, worker, webhook, queue, dashboard]
              status:
                type: string
                enum: [ok, degraded, down, skipped]
              detail:
                type: string
    DashboardSnapshot:
      type: object
      required: [orders_sent, kill_switch_on]
      properties:
        orders_sent:
          type: integer
          description: No ciclo de pesquisa permanece 0.
        kill_switch_on:
          type: boolean
        platform_health:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PlatformHealth'
        research_status:
          type: string
        signal_events:
          type: array
          items:
            $ref: '#/components/schemas/SignalEvent'
        risk_decisions:
          type: array
          items:
            $ref: '#/components/schemas/RiskDecision'
        paper_orders:
          type: array
          items:
            $ref: '#/components/schemas/PaperOrder'
    ControlFlags:
      type: object
      required:
        - kill_switch_on
        - demo_operation_on
        - capital_cents
        - max_risk_per_trade_cents
        - max_open_positions
        - max_aggregate_risk_cents
        - max_daily_loss_cents
        - max_weekly_loss_cents
        - prodigy_risk_cents
      properties:
        kill_switch_on:
          type: boolean
        demo_operation_on:
          type: boolean
        capital_cents:
          type: integer
          format: int64
        max_risk_per_trade_cents:
          type: integer
          format: int64
        max_open_positions:
          type: integer
        max_aggregate_risk_cents:
          type: integer
          format: int64
        max_daily_loss_cents:
          type: integer
          format: int64
        max_weekly_loss_cents:
          type: integer
          format: int64
        prodigy_risk_cents:
          type: integer
          format: int64
    TriggerPatch:
      type: object
      minProperties: 1
      properties:
        kill_switch_on:
          type: boolean
        demo_operation_on:
          type: boolean
        capital_cents:
          type: integer
          format: int64
          minimum: 1
        max_risk_per_trade_cents:
          type: integer
          format: int64
          minimum: 1
        max_open_positions:
          type: integer
          minimum: 1
        max_aggregate_risk_cents:
          type: integer
          format: int64
          minimum: 1
        max_daily_loss_cents:
          type: integer
          format: int64
          minimum: 1
        max_weekly_loss_cents:
          type: integer
          format: int64
          minimum: 1
    TriggerSnapshot:
      type: object
      required: [control_flags, market_controls]
      properties:
        control_flags:
          $ref: '#/components/schemas/ControlFlags'
        market_controls:
          type: array
          items:
            $ref: '#/components/schemas/MarketControl'
    MarketControl:
      type: object
      required: [market, operation_on]
      properties:
        market:
          type: string
          enum: [B3_EQUITY, CRYPTO, FOREX]
        operation_on:
          type: boolean
    MarketControlPatch:
      type: object
      required: [operation_on]
      properties:
        operation_on:
          type: boolean
    StrategyState:
      type: object
      required: [strategy_key, phase]
      properties:
        strategy_key:
          type: string
        phase:
          type: string
          enum: [research, shadow, paper_limited, paper_validated]
    StrategyPhasePatch:
      type: object
      required: [phase]
      properties:
        phase:
          type: string
          enum: [research, shadow, paper_limited, paper_validated]
    SignalsRefreshMode:
      type: string
      description: Distinge releitura em disco (N53) de job com criterios ao vivo (N54).
      enum: [disk_reread, live_criteria]
    PanelSignalIngressRow:
      type: object
      description: Linha de auditoria Feature 9 — ingresso, nao fill.
      additionalProperties: true
      properties:
        origin:
          type: string
        destination:
          type: string
        reject_reason:
          type: string
          nullable: true
        market:
          type: string
          nullable: true
    PreapprovalQueueItem:
      type: object
      description: Provedor candidato na fila; metrics_label pesquisa.
      required: [platform, provider_id, status]
      properties:
        platform:
          type: string
          enum: [collective2, prodigy, tradingview]
        provider_id:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        source:
          type: string
        metrics:
          type: object
          additionalProperties: true
        metrics_label:
          type: string
    PanelCopyBlock:
      type: object
      description: Vista copy de terceiros no painel Sinais.
      properties:
        preapproval:
          type: object
          properties:
            queue:
              type: array
              items:
                $ref: '#/components/schemas/PreapprovalQueueItem'
            metrics_label:
              type: string
        operating:
          type: array
          items:
            type: object
            additionalProperties: true
        history:
          type: array
          items:
            type: object
            additionalProperties: true
        inventory:
          type: object
          additionalProperties: true
        adoption:
          type: object
          additionalProperties: true
        collective2:
          type: object
          additionalProperties: true
        prodigy_pool:
          type: object
          additionalProperties: true
        research_copies:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    PanelSignalsPayload:
      type: object
      required: [signals, copy]
      properties:
        signals:
          type: array
          items:
            $ref: '#/components/schemas/PanelSignalIngressRow'
        copy:
          $ref: '#/components/schemas/PanelCopyBlock'
    PanelSignalsReloadResponse:
      allOf:
        - $ref: '#/components/schemas/PanelSignalsPayload'
        - type: object
          required: [status, reload, mode]
          properties:
            status:
              type: string
              enum: [ok]
            reload:
              type: boolean
              enum: [true]
            mode:
              $ref: '#/components/schemas/SignalsRefreshMode'
              enum: [disk_reread]
            message:
              type: string
            refreshed_at:
              type: string
              format: date-time
            execution_authorized:
              type: boolean
              enum: [false]
            orders_sent:
              type: integer
              enum: [0]
    PanelSignalsReloadError:
      type: object
      required: [status, reload]
      properties:
        status:
          type: string
          enum: [error]
        reload:
          type: boolean
          enum: [false]
        message:
          type: string
    PanelSignalsLiveRefreshResponse:
      allOf:
        - $ref: '#/components/schemas/PanelSignalsPayload'
        - type: object
          required: [status, mode, execution_authorized, orders_sent]
          properties:
            status:
              type: string
              enum: [ok, partial]
            mode:
              $ref: '#/components/schemas/SignalsRefreshMode'
              enum: [live_criteria]
            refreshed_at:
              type: string
              format: date-time
            sources_attempted:
              type: array
              items:
                type: string
                enum: [collective2, prodigy, tradingview]
            sources_ok:
              type: array
              items:
                type: string
            issues:
              type: array
              items:
                type: string
            message:
              type: string
            execution_authorized:
              type: boolean
              enum: [false]
            orders_sent:
              type: integer
              enum: [0]
    CandidatesRefreshRequest:
      type: object
      description: Corpo opcional; vazio dispara todas as fontes permitidas pelo job.
      properties:
        sources:
          type: array
          items:
            type: string
            enum: [collective2, prodigy, tradingview]
        dry_run:
          type: boolean
          default: false
          description: Se true, valida pre-condicoes sem regravar (somente se implementado em N54).
    CandidatesRefreshCooldown:
      type: object
      required: [reject_code]
      properties:
        reject_code:
          type: string
          enum: [REFRESH_COOLDOWN]
        retry_after_seconds:
          type: integer
          minimum: 1
        mode:
          $ref: '#/components/schemas/SignalsRefreshMode'
          enum: [live_criteria]
        message:
          type: string
    CandidatesRefreshUpstreamError:
      type: object
      required: [reject_code, mode]
      properties:
        reject_code:
          type: string
          enum: [UPSTREAM_C2_UNAVAILABLE, UPSTREAM_RANK_FAILED]
        mode:
          $ref: '#/components/schemas/SignalsRefreshMode'
          enum: [live_criteria]
        issues:
          type: array
          items:
            type: string
        bundle_preserved:
          type: boolean
          enum: [true]
    SignalProviderDecisionRequest:
      type: object
      required: [platform, provider_id, action]
      properties:
        platform:
          type: string
          enum: [collective2, prodigy, tradingview]
        provider_id:
          type: string
          minLength: 1
        action:
          type: string
          enum: [approve, reject]
    SignalProviderDecisionResponse:
      type: object
      required: [platform, provider_id, status, execution_authorized, orders_sent]
      properties:
        platform:
          type: string
        provider_id:
          type: string
        status:
          type: string
          enum: [approved, rejected]
        source:
          type: string
          enum: [panel]
        execution_authorized:
          type: boolean
          enum: [false]
        orders_sent:
          type: integer
          enum: [0]
