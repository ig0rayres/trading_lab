openapi: 3.0.3
info:
  title: Trading Lab HTTP boundary
  version: 0.2.0
  description: >
    Gerado pelo analista-sistema na Fase 5. Revisado em 2026-11-03.
    Criar ordem nao e um endpoint. paper_orders nasce dentro do paper-gateway
    depois dos dois gates.
    A escrita HTTP desta revisao so altera gatilho: control_flags, market_controls
    e a fase em strategy_states. Nomes de campo iguais aos do DBML.
servers:
  - url: http://127.0.0.1
    description: Processo local. Sem porta publica neste corte.
tags:
  - name: signal-gate-a
    description: Autenticidade do sinal. Nao envia ordem.
  - name: observability
    description: Leitura do ciclo e escrita de gatilho. Nao envia ordem.
paths:
  /webhooks/tradingview:
    post:
      tags: [signal-gate-a]
      summary: Receber sinal do TradingView
      description: >
        Autenticacao preferida via header X-Webhook-Token (docs/api-spec.yaml).
        Compatibilidade EasyPanel: POST /webhook/{TV_WEBHOOK_TOKEN} sem header (404 se invalido).
      operationId: receiveTradingViewSignal
      security:
        - webhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalEventInput'
      responses:
        '200':
          description: Evento autentico gravado. status no corpo diz se foi accepted ou rejected. Nao e ordem na corretora.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /dashboard/snapshot:
    get:
      tags: [observability]
      summary: Ler o ultimo ciclo, rejeicoes e ledger visivel
      operationId: getDashboardSnapshot
      security:
        - dashboardAuth: []
      responses:
        '200':
          description: Fotografia somente leitura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/triggers:
    get:
      tags: [observability]
      summary: Ler gatilhos vigentes
      operationId: getTriggers
      security:
        - operatorSession: []
      responses:
        '200':
          description: control_flags e market_controls. Sem segredo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [observability]
      summary: Alterar parada, operacao demo ou ancora
      operationId: patchTriggers
      security:
        - operatorSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerPatch'
      responses:
        '200':
          description: Valor gravado. A linha anterior fica em trigger_changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlFlags'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/markets/{market}:
    patch:
      tags: [observability]
      summary: Ligar ou desligar a operacao demo de um mercado
      operationId: patchMarketControl
      security:
        - operatorSession: []
      parameters:
        - name: market
          in: path
          required: true
          schema:
            type: string
            enum: [B3_EQUITY, CRYPTO, FOREX]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketControlPatch'
      responses:
        '200':
          description: market_controls atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/strategies/{strategy_key}:
    patch:
      tags: [observability]
      summary: Mudar a fase de uma estrategia que ja existe
      operationId: patchStrategyPhase
      security:
        - operatorSession: []
      parameters:
        - name: strategy_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyPhasePatch'
      responses:
        '200':
          description: strategy_states atualizado. Nao cria estrategia nova.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Token
      description: Segredo no ambiente. Tamanho minimo 32. O valor nao entra nesta spec.
    dashboardAuth:
      type: http
      scheme: bearer
      description: Leitura publicada. O valor nao entra nesta spec.
    operatorSession:
      type: apiKey
      in: cookie
      name: trading_lab_session
      description: >
        Escrita de gatilho. Bearer sozinho nao autoriza PATCH.
        O valor do cookie nao entra nesta spec.
  responses:
    Unauthorized:
      description: Nao autenticado
    Forbidden:
      description: Autenticado sem permissao, ou live ligado
    NotFound:
      description: Recurso ausente
    Unprocessable:
      description: Validacao falhou
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ServerError:
      description: Falha interna sem vazar segredo
  schemas:
    ErrorBody:
      type: object
      required: [reject_code]
      properties:
        reject_code:
          type: string
        status:
          type: string
    SignalEventInput:
      type: object
      required: [idempotency_key, source, symbol, side]
      properties:
        idempotency_key:
          type: string
          maxLength: 128
        source:
          type: string
          maxLength: 64
        symbol:
          type: string
          maxLength: 32
        side:
          type: string
          enum: [long, short]
        strategy_key:
          type: string
          maxLength: 64
    SignalEvent:
      type: object
      description: Mesmos nomes de signal_events no DBML.
      required: [id, idempotency_key, source, symbol, side, status, received_at]
      properties:
        id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        source:
          type: string
        symbol:
          type: string
        market:
          type: string
          nullable: true
          enum: [B3_EQUITY, CRYPTO, FOREX]
        side:
          type: string
          enum: [long, short]
        status:
          type: string
          enum: [received, rejected, accepted]
        reject_code:
          type: string
          nullable: true
        received_at:
          type: string
          format: date-time
    RiskDecision:
      type: object
      required: [id, signal_event_id, strategy_key, decision]
      properties:
        id:
          type: string
          format: uuid
        signal_event_id:
          type: string
          format: uuid
        strategy_key:
          type: string
        decision:
          type: string
          enum: [rejected, paper_allowed]
        reject_code:
          type: string
          nullable: true
        risk_amount_cents:
          type: integer
          format: int64
    PaperOrder:
      type: object
      required: [id, risk_decision_id, client_order_id, symbol, side, status]
      properties:
        id:
          type: string
          format: uuid
        risk_decision_id:
          type: string
          format: uuid
        client_order_id:
          type: string
        broker_order_id:
          type: string
          nullable: true
        symbol:
          type: string
        market:
          type: string
          nullable: true
          enum: [B3_EQUITY, CRYPTO, FOREX]
        side:
          type: string
          enum: [long, short]
        status:
          type: string
        qty:
          type: string
          description: Decimal como texto para nao perder precisao.
    DashboardSnapshot:
      type: object
      required: [orders_sent, kill_switch_on]
      properties:
        orders_sent:
          type: integer
          description: No ciclo de pesquisa permanece 0.
        kill_switch_on:
          type: boolean
        research_status:
          type: string
        signal_events:
          type: array
          items:
            $ref: '#/components/schemas/SignalEvent'
        risk_decisions:
          type: array
          items:
            $ref: '#/components/schemas/RiskDecision'
        paper_orders:
          type: array
          items:
            $ref: '#/components/schemas/PaperOrder'
    ControlFlags:
      type: object
      required:
        - kill_switch_on
        - demo_operation_on
        - capital_cents
        - max_risk_per_trade_cents
        - max_open_positions
        - max_aggregate_risk_cents
        - max_daily_loss_cents
        - max_weekly_loss_cents
        - prodigy_risk_cents
      properties:
        kill_switch_on:
          type: boolean
        demo_operation_on:
          type: boolean
        capital_cents:
          type: integer
          format: int64
        max_risk_per_trade_cents:
          type: integer
          format: int64
        max_open_positions:
          type: integer
        max_aggregate_risk_cents:
          type: integer
          format: int64
        max_daily_loss_cents:
          type: integer
          format: int64
        max_weekly_loss_cents:
          type: integer
          format: int64
        prodigy_risk_cents:
          type: integer
          format: int64
    TriggerPatch:
      type: object
      minProperties: 1
      properties:
        kill_switch_on:
          type: boolean
        demo_operation_on:
          type: boolean
        capital_cents:
          type: integer
          format: int64
          minimum: 1
        max_risk_per_trade_cents:
          type: integer
          format: int64
          minimum: 1
        max_open_positions:
          type: integer
          minimum: 1
        max_aggregate_risk_cents:
          type: integer
          format: int64
          minimum: 1
        max_daily_loss_cents:
          type: integer
          format: int64
          minimum: 1
        max_weekly_loss_cents:
          type: integer
          format: int64
          minimum: 1
    TriggerSnapshot:
      type: object
      required: [control_flags, market_controls]
      properties:
        control_flags:
          $ref: '#/components/schemas/ControlFlags'
        market_controls:
          type: array
          items:
            $ref: '#/components/schemas/MarketControl'
    MarketControl:
      type: object
      required: [market, operation_on]
      properties:
        market:
          type: string
          enum: [B3_EQUITY, CRYPTO, FOREX]
        operation_on:
          type: boolean
    MarketControlPatch:
      type: object
      required: [operation_on]
      properties:
        operation_on:
          type: boolean
    StrategyState:
      type: object
      required: [strategy_key, phase]
      properties:
        strategy_key:
          type: string
        phase:
          type: string
          enum: [research, shadow, paper_limited, paper_validated]
    StrategyPhasePatch:
      type: object
      required: [phase]
      properties:
        phase:
          type: string
          enum: [research, shadow, paper_limited, paper_validated]
