name: CI

on:
  push:
    branches: [master, main, front/**, sprint/**]
  pull_request:

env:
  LIVE_TRADING_ENABLED: "false"
  PYTHONPATH: src

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trading_lab
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: trading_lab_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_lab -d trading_lab_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Record upstream SHA
        run: echo "UPSTREAM_SHA=$(git -C vendor/day-trader-skill rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Pytest
        env:
          UPSTREAM_DIR: ${{ github.workspace }}/vendor/day-trader-skill
          LEDGER_DATABASE_URL: postgresql://trading_lab:ci_test_only@localhost:5432/trading_lab_ci
        run: python -m pytest -q --tb=no

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t trading-lab:ci .
